# Единая точка входа стенда: статика SPA и обратный прокси к Web API (раздел 5.1 ТЗ).

upstream periphshop_api {
    server api:8080;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Заголовки безопасности для SPA (раздел 9 ТЗ).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Прокси к API: заголовки нужны, чтобы rate limiter видел реальный адрес клиента.
    location /api/ {
        proxy_pass http://periphshop_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /swagger/ {
        proxy_pass http://periphshop_api;
        proxy_set_header Host $host;
    }

    location /health/ {
        proxy_pass http://periphshop_api;
        proxy_set_header Host $host;
    }

    # Хэшированные бандлы можно кэшировать надолго.
    location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # SPA-роутинг: любой неизвестный путь отдаёт index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
